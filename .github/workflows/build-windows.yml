name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Freeze
        run: pyinstaller packaging/phenoforge.spec --noconfirm
      - name: Smoke test the CLI exe
        run: dist\PhenoForge\phenoforge-cli.exe demo --out demo.ply
      - name: Zip
        run: Compress-Archive -Path dist\PhenoForge -DestinationPath PhenoForge-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhenoForge-windows-x64
          path: PhenoForge-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhenoForge-windows-x64.zip
