name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0); leave empty to only build"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Freeze
        run: pyinstaller packaging/phenoforge.spec --noconfirm
      - name: Smoke test the CLI exe
        run: dist\PhenoForge\phenoforge-cli.exe demo --out demo.ply
      - name: Zip
        run: Compress-Archive -Path dist\PhenoForge -DestinationPath PhenoForge-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhenoForge-windows-x64
          path: PhenoForge-windows-x64.zip
      - name: Zip SOPs and turntable print files
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: |
          Compress-Archive -Path docs\sop\*.pdf -DestinationPath PhenoForge-SOPs.zip
          Compress-Archive -Path hardware\turntable\bambu, hardware\turntable\stl, hardware\turntable\turntable.scad, hardware\turntable\README.md, hardware\turntable\pi -DestinationPath PhenoForge-turntable-print-files.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PhenoForge ${{ inputs.release_tag || github.ref_name }}
          body: |
            Open-source 3D plant phenotyping for Windows.
            **Install:** download PhenoForge-windows-x64.zip, unzip, run PhenoForge.exe (no other install needed; COLMAP and Ollama are optional).
            Also attached: the illustrated capture SOPs (PDF) and the motorised turntable print files (Bambu Studio 3MF for the X1 Carbon, STL, OpenSCAD, Pi script).
          files: |
            PhenoForge-windows-x64.zip
            PhenoForge-SOPs.zip
            PhenoForge-turntable-print-files.zip
